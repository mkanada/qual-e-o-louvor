<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qual é o Louvor?</title>
<meta name="description" content="Jogo de dois times para adivinhar louvores com notas, dica e plateia.">
<style>
:root{
  --bg:#f6f3ec; --card:#fff; --ink:#1f2933; --muted:#6b7280; --line:#e3ded2;
  --accent:#b4531c; --accent-ink:#fff; --ok:#1f7a4d; --bad:#b42318; --soft:#fbe9dc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130f; --card:#211d17; --ink:#f1ece2; --muted:#a39b8c; --line:#3a342a;
    --accent:#e8883f; --accent-ink:#1a1208; --ok:#5fcf97; --bad:#ff8a7a; --soft:#33271b;
  }
}
:root[data-theme="dark"]{
  --bg:#16130f; --card:#211d17; --ink:#f1ece2; --muted:#a39b8c; --line:#3a342a;
  --accent:#e8883f; --accent-ink:#1a1208; --ok:#5fcf97; --bad:#ff8a7a; --soft:#33271b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:1.6rem;margin:0}
.score{color:var(--muted);font-size:.9rem;text-align:right}
.score b{color:var(--ink);font-size:1.1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.notes{display:flex;gap:6px;margin:4px 0 14px}
.dot{flex:1;height:10px;border-radius:5px;background:var(--line)}
.dot.on{background:var(--accent)}
button,input{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
button{cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
input{width:100%;min-width:0}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row>*{flex:1 1 auto}
h2{font-size:1rem;margin:0 0 8px;color:var(--muted);font-weight:600}
.hint{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:1.1rem}
.msg{font-weight:600;margin:0 0 10px}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
#feedback{min-height:1.5em;margin:8px 0 0;color:var(--bad);font-weight:600}
.teams{display:flex;gap:8px;margin-top:16px}
.team{flex:1;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.team.turn{border-color:var(--accent);background:var(--soft)}
.team .n{font-size:.85rem;color:var(--muted)}
.team .p{font-size:1.6rem;font-weight:700;line-height:1.2}
.team .c{font-size:.85rem;color:var(--muted)}
.turnmsg{font-weight:700;font-size:1.15rem;margin:0 0 10px}
label.f{display:block;margin:0 0 12px;color:var(--muted);font-size:.9rem}
label.f input{margin-top:4px;color:var(--ink)}
.yt{position:relative;aspect-ratio:16/9;margin:10px 0;border-radius:10px;overflow:hidden;background:#000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:600}
button.no{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:600}
[hidden]{display:none!important}
.tries{list-style:none;margin:10px 0 0;padding:0;color:var(--bad);font-weight:600}
.tries li::before{content:"✘ "}
footer{color:var(--muted);font-size:.85rem;margin-top:24px;text-align:center}
</style>
</head>
<body>
<main>
  <header>
    <h1>🎵 Qual é o Louvor?</h1>
    <div class="score" id="roundBox" hidden>rodada <b id="round">1</b>/<span id="nrounds">10</span></div>
  </header>

  <section class="card" id="setup">
    <h2>Novo jogo</h2>
    <label class="f">Nome do time 1<input id="name1" value="Time 1" maxlength="20"></label>
    <label class="f">Nome do time 2<input id="name2" value="Time 2" maxlength="20"></label>
    <label class="f">Créditos de notas por time (para a partida toda)<input id="credits" type="number" min="0" max="99" value="5" inputmode="numeric"></label>
    <button class="primary" id="btnStart" style="width:100%">Começar</button>
  </section>

  <div id="game" hidden>
    <div class="teams">
      <div class="team" id="team0"></div>
      <div class="team" id="team1"></div>
    </div>

    <section class="card">
      <p class="turnmsg" id="turnMsg"></p>
      <h2>Dica</h2>
      <div class="hint" id="hint"></div>
    </section>

    <section class="card">
      <h2>Notas</h2>
      <div class="notes" id="dots" aria-label="Notas liberadas"></div>
      <div class="row">
        <button class="primary" id="btnPlay">▶ Tocar</button>
        <button id="btnMore">+ Mais uma nota</button>
      </div>
    </section>

    <section class="card" id="judge">
      <h2 id="judgeTitle"></h2>
      <form class="row" id="form" autocomplete="off">
        <input id="answer" type="text" placeholder="Digite a resposta" aria-label="Resposta" style="flex:3 1 200px">
        <button class="primary" type="submit" style="flex:1 1 90px">Responder</button>
      </form>
      <ul class="tries" id="tries"></ul>
      <button id="btnGive" style="margin-top:12px">Encerrar sem ponto</button>
    </section>

    <section class="card" id="result" hidden>
      <p class="msg" id="resMsg"></p>
      <div class="yt" id="ytBox"></div>
      <p><a id="ytLink" target="_blank" rel="noopener">Abrir no YouTube</a></p>
      <button class="primary" id="btnNext">Próxima música →</button>
    </section>
  </div>

  <footer><button id="btnTheme" style="padding:4px 10px;font-size:.8rem">🌓 tema</button></footer>
</main>

<script>
// v/st: vídeo do YouTube e segundo inicial do trecho; n: número no hinário
const SONGS = [
  {t:"Lado a lado", f:"lado-a-lado", s:"", v:"ZrnPn--2-C0", st:20, n:245,
   h:"Nem à frente, nem atrás, duas vezes"},
  {t:"Santo santo santo", f:"santo-santo-santo", s:"", v:"FDpludwY46U", st:11, n:1,
   h:"Uma só palavra, dita três vezes"},
  {t:"Vencendo vem Jesus", f:"vencendo-vem", s:"", v:"U4ym16En8xc", st:39, n:441, a:["Vencendo vem"],
   h:"Ele não chega perdendo, nem empatando"},
  {t:"Canção da vida", f:"cancao-vida", s:"", v:"EyOkqnp-boI", st:37, n:375,
   h:"Não é uma canção qualquer. É a que acompanha a existência inteira, do primeiro ao último fôlego."},
  {t:"Sou de Jesus", f:"sou-de-jesus", s:"", v:"lNnC4Lj998s", st:69, n:162,
   h:"Em 1 Coríntios 6, Paulo lembra que não somos de nós mesmos, fomos comprados por preço."},
  {t:"A esperança é Jesus", f:"esperanca", s:"", v:"8hKR6ohrexE", st:91, n:33, a:["Esperança é Jesus"],
   h:"Dizem que é a última que morre, mas aqui ela tem nome."},
  {t:"Meu farol", f:"meu-farol", s:"", v:"kO1XALdcp_4", st:58,
   h:"Na tempestade, é importante para o marinheiro"},
  {t:"Vitória em nome de Jesus", f:"vitoria", s:"", v:"J-YH-Nojg6E", st:95, a:["Vitória em nome"],
   h:"O contrário de derrota, conquistada não pela própria força, mas invocando um Nome."},
  {t:"Rumo ao lar", f:"rumo-ao-lar", s:"", v:"Qrv5FNt_AKo", st:50,
   h:"O que a bússola indica, alguns chamam de doce"},
  {t:"Maranata", f:"maranata", s:"-nota", v:"Y0HKm6tsNV4", st:159,
   h:"Saudação adventista"}
];
const MAX = 10, CLIP = 10;
const $ = id => document.getElementById(id);

let order, idx, song, notes, done, first, tries, score, credits, names, audio = null;

function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const file = (s,n) => `${s.f}-${String(n).padStart(2,"0")}${s.s}.mp3`;
const esc = x => x.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const norm = x => x.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
  .replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();

function lev(a, b){
  const d = Array.from({length:a.length+1},(_,i)=>[i]);
  for (let j=1;j<=b.length;j++) d[0][j]=j;
  for (let i=1;i<=a.length;i++) for (let j=1;j<=b.length;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}

// aceita se a distância de edição for pequena (≈ 1 erro a cada 6 letras)
function matches(input, s){
  const x = norm(input);
  if (!x) return false;
  return [s.t, ...(s.a||[])].some(c => {
    const y = norm(c);
    return lev(x, y) <= Math.floor(y.length / 6);
  });
}

// Quem responde na tentativa k: 0 = time que começou, 1 = o outro time,
// depois a plateia do que começou, a plateia do outro, e assim por diante.
function actor(k){
  if (k < 2) return {team:(first + k) % 2, crowd:false};
  return {team:(first + k) % 2, crowd:true};
}
const who = a => a.crowd ? `plateia de ${names[a.team]}` : names[a.team];

function newGame(){
  names = [$("name1").value.trim() || "Time 1", $("name2").value.trim() || "Time 2"];
  const c = Math.max(0, Math.min(99, parseInt($("credits").value, 10) || 0));
  credits = [c, c]; score = [0, 0];
  order = shuffle(SONGS.map((_,i)=>i)); idx = 0;
  $("nrounds").textContent = SONGS.length;
  $("setup").hidden = true; $("game").hidden = false; $("roundBox").hidden = false;
  startRound();
}

function startRound(){
  stop();
  song = SONGS[order[idx]];
  notes = 1; done = false; tries = [];
  first = idx % 2;                          // alterna quem começa
  $("round").textContent = idx+1;
  $("hint").textContent = song.h;
  $("result").hidden = true; $("ytBox").innerHTML = "";
  $("answer").value = "";
  render();
  $("answer").focus();
}

function render(){
  const k = tries.length, a = actor(k);
  [0,1].forEach(i => {
    const el = $("team"+i);
    el.className = "team" + (!done && a.team === i ? " turn" : "");
    el.innerHTML = `<div class="n">${esc(names[i])}</div><div class="p">${score[i]}</div><div class="c">${credits[i]} crédito${credits[i]===1?"":"s"}</div>`;
  });
  $("dots").innerHTML = Array.from({length:MAX},(_,i)=>`<div class="dot ${i<notes?"on":""}"></div>`).join("");
  $("btnPlay").textContent = `▶ Tocar ${notes} ${notes === 1 ? "nota" : "notas"}`;
  // só o time que começa compra notas, e só antes de responder
  const canBuy = !done && k === 0;
  const left = credits[first];
  $("btnMore").disabled = !canBuy || notes >= MAX || left < 1;
  $("btnMore").textContent = !canBuy ? "+ Mais uma nota"
    : left < 1 ? "Sem créditos: só a dica"
    : `+ Mais uma nota (−1 crédito, restam ${left})`;
  $("turnMsg").textContent = done ? "" : `Vez de: ${who(a)}`;
  $("judge").hidden = done;
  $("judgeTitle").textContent = `Digite a resposta de: ${who(a)}`;
  $("tries").innerHTML = tries.map(t => `<li>${esc(t.text)} <small>(${esc(t.by)})</small></li>`).join("");
}

function finish(winner){
  done = true; stop();
  if (winner !== null) score[winner]++;
  const last = idx === SONGS.length-1;
  $("resMsg").className = "msg " + (winner !== null ? "ok" : "bad");
  $("resMsg").textContent = (winner !== null ? `✅ ${names[winner]} ganha o ponto! ` : "Ninguém ganhou o ponto. ")
    + `Era "${song.t}"` + (song.n ? ` (hino ${song.n})` : "") + ".";
  const src = `https://www.youtube-nocookie.com/embed/${song.v}?start=${song.st}&end=${song.st+CLIP}&autoplay=1&rel=0&playsinline=1`;
  $("ytBox").innerHTML = `<iframe src="${src}" title="${esc(song.t)}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  $("ytLink").href = `https://youtu.be/${song.v}?t=${song.st}`;
  if (last) {
    const [x,y] = score;
    $("btnNext").textContent = `Fim! ${x===y ? "Empate" : "Vitória: " + names[x>y?0:1]} (${x} × ${y}) — novo jogo`;
  } else $("btnNext").textContent = "Próxima música →";
  $("result").hidden = false;
  render();
  $("result").scrollIntoView({behavior:"smooth", block:"nearest"});
}

$("btnStart").onclick = newGame;

$("form").onsubmit = e => {
  e.preventDefault();
  const text = $("answer").value.trim();
  if (done || !text) return;
  const a = actor(tries.length);
  if (matches(text, song)) { finish(a.team); return; }
  tries.push({text, by: who(a)});
  $("answer").value = "";
  render();
  $("answer").focus();
};

$("btnGive").onclick = () => { if (!done) finish(null); };

function stop(){ if (audio) { audio.pause(); audio = null; } }
function play(){
  stop();
  audio = new Audio(file(song, notes));
  audio.play().catch(()=>{});
}

$("btnPlay").onclick = play;
$("btnMore").onclick = () => {
  if (done || tries.length > 0 || notes >= MAX || credits[first] < 1) return;
  credits[first]--; notes++; render(); play();
};
$("btnNext").onclick = () => {
  if (idx === SONGS.length-1) {
    $("game").hidden = true; $("roundBox").hidden = true; $("setup").hidden = false;
  } else { idx++; startRound(); }
};
$("btnTheme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
};
</script>
</body>
</html>
