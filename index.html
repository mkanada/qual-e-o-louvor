<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qual é o Louvor?</title>
<meta name="description" content="Jogo de dois times para adivinhar louvores com notas, dica e plateia.">
<style>
/* tema festivo: cores vivas, gradiente, cantos bem redondos e confete */
:root{
  --bg1:#ffe3f1; --bg2:#fff3c4; --bg3:#d9f1ff;
  --card:#fff; --ink:#2b1b4a; --muted:#7a6a99; --line:#f0d9ea;
  --accent:#e6399b; --accent2:#ff9f1c; --accent-ink:#fff;
  --ok:#12a150; --bad:#e03131; --soft:#fff0b8;
  --t0:#ff7a1a; --t1:#11a6a0; --shadow:0 .3rem 0 rgba(230,57,155,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#2a1050; --bg2:#3a1450; --bg3:#12274d;
    --card:#2c1b4d; --ink:#fff4fb; --muted:#c3a9e6; --line:#4d3380;
    --accent:#ff5cb8; --accent2:#ffc44d; --accent-ink:#2a1050;
    --ok:#4ee38a; --bad:#ff8080; --soft:#4a3370;
    --t0:#ff9a47; --t1:#3fd9d2; --shadow:0 .3rem 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg1:#2a1050; --bg2:#3a1450; --bg3:#12274d;
  --card:#2c1b4d; --ink:#fff4fb; --muted:#c3a9e6; --line:#4d3380;
  --accent:#ff5cb8; --accent2:#ffc44d; --accent-ink:#2a1050;
  --ok:#4ee38a; --bad:#ff8080; --soft:#4a3370;
  --t0:#ff9a47; --t1:#3fd9d2; --shadow:0 .3rem 0 rgba(0,0,0,.35);
}
/* a tela inteira cabe sempre na janela (TV 16:9, celular deitado ou em pé): nada de rolar a página */
html{font-size:clamp(11px,min(1.45vw,2.7vh),34px)}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;color:var(--ink);
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));
  font:1rem/1.35 "Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:.6rem;padding:.6rem 1rem;max-width:1900px;margin:0 auto}
[hidden]{display:none!important}

.top{display:flex;align-items:center;gap:.6rem;flex:0 0 auto}
.brand{font-size:1.5rem;font-weight:900;white-space:nowrap;
  background:linear-gradient(90deg,var(--accent),var(--accent2),var(--t1));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{display:inline-block;-webkit-text-fill-color:initial;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.25rem) rotate(12deg)}}
.team{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:.6rem;background:var(--card);border:.2rem solid var(--line);border-radius:999px;padding:.2rem .9rem;box-shadow:var(--shadow)}
.team .p{font-size:2rem;font-weight:900;line-height:1}
.team .n{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .c{font-size:.8rem;color:var(--muted);white-space:nowrap}
#team0 .n{color:var(--t0)} #team1 .n{color:var(--t1)}
#team0.turn{border-color:var(--t0);background:var(--soft)} #team1.turn{border-color:var(--t1);background:var(--soft)}
.round{text-align:center;color:var(--muted);font-size:.8rem;white-space:nowrap;line-height:1.1}
.round b{display:block;color:var(--accent);font-size:1.4rem}
.tools{display:flex;gap:.35rem;margin-left:auto}
.tools button{padding:.35rem .7rem;white-space:nowrap}

.banner{flex:0 0 auto;display:flex;align-items:center;gap:1rem;border-radius:1.2rem;padding:.5rem 1rem;color:#fff;background:var(--t0);box-shadow:var(--shadow)}
.banner.t1{background:var(--t1)}
.banner.crowd{background:linear-gradient(135deg,var(--accent),#7950f2);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.015)}}
#bannerText{flex:1 1 auto;font-size:1.7rem;font-weight:900;line-height:1.1}
#bannerText small{display:block;font-size:.8rem;font-weight:700;opacity:.92}
.steps{display:flex;gap:.3rem;font-size:.8rem;font-weight:800}
.step{border-radius:999px;padding:.2rem .7rem;background:rgba(255,255,255,.2);white-space:nowrap}
.step.now{background:#fff;color:#2b1b4a}
.step.past{text-decoration:line-through;opacity:.7}

.cols{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (orientation:portrait){.cols{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.card{background:var(--card);border:.2rem solid var(--line);border-radius:1.3rem;padding:.9rem 1.1rem;box-shadow:var(--shadow);min-height:0;display:flex;flex-direction:column;gap:.6rem;overflow:hidden}
h2{font-size:.85rem;margin:0;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;gap:.35rem}
@media (orientation:portrait){.chips{flex-wrap:wrap}.chip{flex-basis:15%!important}}
.chip{flex:1 1 0;padding:.6rem 0;border-radius:999px;font-weight:800;font-size:1.2rem;text-align:center;
  background:var(--card);border:.2rem solid var(--line);color:var(--muted)}
.chip.paid{background:var(--accent2);border-color:var(--accent2);color:#3a2300}
.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cost{margin:0;font-weight:700;color:var(--muted)}
.big{font-size:1.5rem;padding:.7rem}
.grow{flex:1 1 auto}

button,input{font:inherit;border-radius:999px;border:.2rem solid var(--line);background:var(--card);color:var(--ink);padding:.55rem 1rem}
input{border-radius:1rem;width:100%;min-width:0;font-size:1.3rem}
input:focus{outline:.2rem solid var(--accent2);outline-offset:1px}
button{cursor:pointer;transition:transform .12s}
button:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.row{display:flex;gap:.5rem}
.row>*{flex:1 1 auto}
.tries{list-style:none;margin:0;padding:0;color:var(--bad);font-weight:700;flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start}
.tries li::before{content:"✘ "}
.tries li.skip{color:var(--muted)} .tries li.skip::before{content:"⏭ "}

/* painéis que entram e saem por cima (dica, resultado, início) */
.pop{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(20,8,40,.55)}
.pop .card{width:min(70rem,100%);max-height:100%;text-align:center;gap:1rem;padding:1.5rem 2rem}
.hintText{font-size:2.6rem;font-weight:800;line-height:1.2}
.msg{font-weight:900;font-size:2rem;margin:0}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.tap{color:var(--muted);font-size:.9rem;margin:0}
#ytLink{color:var(--muted)}
#setup{background:none}
label.f{display:block;color:var(--muted);font-weight:700;text-align:left}
label.f input{margin-top:.2rem;color:var(--ink)}

#stage{position:fixed;inset:0;z-index:10;background:#000}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#stage button{position:absolute;top:12px;right:12px;z-index:1;opacity:.7}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion: reduce){.brand span,.banner.crowd{animation:none} button{transition:none}}
/* celular em pé: título e botões numa linha, times na outra */
@media (orientation:portrait){
  html{font-size:clamp(11px,min(3.6vw,1.9vh),30px)}
  .top{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"brand brand tools" "t0 round t1"}
  .brand{grid-area:brand;min-width:0;font-size:1.3rem;overflow:hidden;text-overflow:ellipsis}
  .brand span{display:none}
  .tools{grid-area:tools;margin-left:0}
  #team0{grid-area:t0} #team1{grid-area:t1} .round{grid-area:round}
  .banner{flex-wrap:wrap;gap:.4rem}
  #bannerText{font-size:1.4rem}
  .steps{flex:1 1 100%}
  .step{flex:1 1 0;text-align:center}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span>🎵</span> Qual é o Louvor? <span>🎉</span></div>
    <div class="team" id="team0" hidden></div>
    <div class="round" id="roundBox" hidden>rodada<b id="round">1</b>de <span id="nrounds">10</span></div>
    <div class="team" id="team1" hidden></div>
    <div class="tools">
      <button id="btnHint" hidden>💡 Dica</button>
      <button id="btnTheme" title="Tema claro/escuro">🌓</button>
      <button id="btnReset" title="Reiniciar jogo" hidden>↺</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden><div id="bannerText"></div><div class="steps" id="steps"></div></div>

  <div class="cols" id="game" hidden>
    <section class="card">
      <h2>Quantas notas?</h2>
      <div class="chips" id="dots" role="group" aria-label="Número de notas"></div>
      <p class="cost" id="cost"></p>
      <div class="grow"></div>
      <button class="primary big" id="btnPlay">▶ Tocar</button>
    </section>

    <section class="card" id="judge">
      <h2 id="judgeTitle"></h2>
      <form class="row" id="form" autocomplete="off">
        <input id="answer" type="text" placeholder="Digite a resposta" aria-label="Resposta" style="flex:3 1 0">
        <button class="primary" type="submit" style="flex:1 1 0">Responder</button>
      </form>
      <ul class="tries" id="tries"></ul>
      <div class="row">
        <button id="btnPass">⏭ Passar a vez</button>
        <button id="btnCrowd">👏 Chamar a plateia</button>
        <button id="btnGive">Encerrar sem ponto</button>
      </div>
    </section>
  </div>
</div>

<div class="pop" id="setup">
  <section class="card" style="width:min(34rem,100%)">
    <h2>Novo jogo</h2>
    <label class="f">Nome do time 1<input id="name1" value="Time 1" maxlength="20"></label>
    <label class="f">Nome do time 2<input id="name2" value="Time 2" maxlength="20"></label>
    <label class="f">Créditos de notas por time (para a partida toda)<input id="credits" type="number" min="0" max="99" value="5" inputmode="numeric"></label>
    <button class="primary big" id="btnStart">Começar</button>
  </section>
</div>

<div class="pop" id="hintPop" hidden>
  <section class="card">
    <h2>💡 Dica</h2>
    <div class="hintText" id="hint"></div>
    <p class="tap">Toque em qualquer lugar para fechar. Ela volta pelo botão "💡 Dica" lá em cima.</p>
  </section>
</div>

<div class="pop" id="result" hidden>
  <section class="card">
    <p class="msg" id="resMsg"></p>
    <div class="row">
      <button id="btnReplay">▶ Rever o trecho</button>
      <button class="primary big" id="btnNext">Próxima música →</button>
    </div>
    <a id="ytLink" target="_blank" rel="noopener">Abrir no YouTube</a>
  </section>
</div>

<canvas id="confetti"></canvas>
<div id="stage" hidden><button id="btnCloseStage">✕ Fechar</button><div id="ytBox"></div></div>

<script>
// v/st: vídeo do YouTube e segundo inicial do trecho; n: número no hinário
const SONGS = [
  {t:"Lado a lado", f:"lado-a-lado", s:"", v:"ZrnPn--2-C0", st:20, n:245,
   h:"Nem à frente, nem atrás, duas vezes"},
  {t:"Santo santo santo", f:"santo-santo-santo", s:"", v:"FDpludwY46U", st:11, n:1,
   h:"Uma só palavra, dita três vezes"},
  {t:"Vencendo vem Jesus", f:"vencendo-vem", s:"", v:"U4ym16En8xc", st:39, n:441, a:["Vencendo vem"],
   h:"Ele não chega perdendo, nem empatando"},
  {t:"Canção da vida", f:"cancao-vida", s:"", v:"EyOkqnp-boI", st:37, n:375,
   h:"Não é uma canção qualquer. É a que acompanha a existência inteira, do primeiro ao último fôlego."},
  {t:"Sou de Jesus", f:"sou-de-jesus", s:"", v:"lNnC4Lj998s", st:69, n:162,
   h:"Em 1 Coríntios 6, Paulo lembra que não somos de nós mesmos, fomos comprados por preço."},
  {t:"A esperança é Jesus", f:"esperanca", s:"", v:"8hKR6ohrexE", st:91, n:33, a:["Esperança é Jesus"],
   h:"Dizem que é a última que morre, mas aqui ela tem nome."},
  {t:"Meu farol", f:"meu-farol", s:"", v:"kO1XALdcp_4", st:58,
   h:"Na tempestade, é importante para o marinheiro"},
  {t:"Vitória em nome de Jesus", f:"vitoria", s:"", v:"J-YH-Nojg6E", st:95, a:["Vitória em nome"],
   h:"O contrário de derrota, conquistada não pela própria força, mas invocando um Nome."},
  {t:"Rumo ao lar", f:"rumo-ao-lar", s:"", v:"Qrv5FNt_AKo", st:50,
   h:"O que a bússola indica, alguns chamam de doce"},
  {t:"Maranata", f:"maranata", s:"-nota", v:"Y0HKm6tsNV4", st:159,
   h:"Saudação adventista"}
];
const MAX = 10, CLIP = 10;
const $ = id => document.getElementById(id);

let order, idx, song, notes, sel, done, won = null, playing = false, celebrate = false, first, tries, score, credits, names, audio = null;

function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const file = (s,n) => `${s.f}-${String(n).padStart(2,"0")}${s.s}.mp3`;
const esc = x => x.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const norm = x => x.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
  .replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();

function lev(a, b){
  const d = Array.from({length:a.length+1},(_,i)=>[i]);
  for (let j=1;j<=b.length;j++) d[0][j]=j;
  for (let i=1;i<=a.length;i++) for (let j=1;j<=b.length;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}

// aceita se a distância de edição for pequena (≈ 1 erro a cada 6 letras)
function matches(input, s){
  const x = norm(input);
  if (!x) return false;
  return [s.t, ...(s.a||[])].some(c => {
    const y = norm(c);
    return lev(x, y) <= Math.floor(y.length / 6);
  });
}

// Quem responde na tentativa k: 0 = time que começou, 1 = o outro time,
// depois a plateia do que começou, a plateia do outro, e assim por diante.
function actor(k){
  if (k < 2) return {team:(first + k) % 2, crowd:false};
  return {team:(first + k) % 2, crowd:true};
}
const who = a => a.crowd ? `plateia de ${names[a.team]}` : names[a.team];

function newGame(){
  names = [$("name1").value.trim() || "Time 1", $("name2").value.trim() || "Time 2"];
  const c = Math.max(0, Math.min(99, parseInt($("credits").value, 10) || 0));
  credits = [c, c]; score = [0, 0];
  order = shuffle(SONGS.map((_,i)=>i)); idx = 0;
  playing = true;
  showGame(true);
  startRound();
}
function showGame(on){
  $("nrounds").textContent = SONGS.length;
  $("setup").hidden = on;
  ["game","banner","team0","team1","roundBox","btnHint","btnReset"].forEach(id => $(id).hidden = !on);
  if (!on) { $("result").hidden = true; $("hintPop").hidden = true; }
}

// o estado do jogo fica no navegador: se a energia cair, tudo volta ao reabrir a página
const KEY = "qual-e-o-louvor:v1";
function save(){
  if (!playing) return;
  try { localStorage.setItem(KEY, JSON.stringify({names, credits, score, order, idx, notes, sel, done, won, first, tries})); } catch {}
}
function forget(){ playing = false; try { localStorage.removeItem(KEY); } catch {} }
function restore(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (!d || !Array.isArray(d.order) || d.order.length !== SONGS.length || !SONGS[d.order[d.idx]]) return false;
    ({names, credits, score, order, idx, notes, sel, done, won, first, tries} = d);
    if (!Array.isArray(tries) || !Array.isArray(names) || !Array.isArray(credits) || !Array.isArray(score)) return false;
    playing = true;
  } catch { return false; }
  song = SONGS[order[idx]];
  showGame(true);
  $("round").textContent = idx+1;
  $("hint").textContent = song.h;
  if (done) showResult(won);
  render();
  return true;
}

function startRound(){
  stop();
  song = SONGS[order[idx]];
  notes = 1; sel = 1; done = false; won = null; tries = [];
  first = idx % 2;                          // alterna quem começa
  $("round").textContent = idx+1;
  $("hint").textContent = song.h;
  $("result").hidden = true; closeStage();
  $("answer").value = "";
  render();
  $("hintPop").hidden = false;              // a dica abre sozinha no começo da rodada
}

function render(){
  const k = tries.length, a = actor(k);
  [0,1].forEach(i => {
    const el = $("team"+i);
    el.classList.toggle("turn", !done && a.team === i);
    el.innerHTML = `<div class="p">${score[i]}</div><div style="min-width:0"><div class="n">${esc(names[i])}</div><div class="c">${credits[i]} crédito${credits[i]===1?"":"s"}</div></div>`;
  });
  // notes = notas já pagas; sel = escolhida (só vale pagar ao tocar ou responder)
  const canPick = !done && k === 0, left = credits[first];
  $("dots").innerHTML = Array.from({length:MAX},(_,i)=>{
    const n = i+1;
    const off = !canPick || n < notes || n - notes > left;
    return `<button type="button" class="chip ${n <= notes ? "paid" : ""}${n > notes && n <= sel ? " sel" : ""}" data-n="${n}" ${off ? "disabled" : ""} aria-label="${n} ${n===1?"nota":"notas"}">${n}</button>`;
  }).join("");
  const extra = sel - notes;
  $("cost").textContent = !canPick ? `${notes} ${notes===1?"nota liberada":"notas liberadas"}`
    : extra > 0 ? `${sel} notas: custa ${extra} crédito${extra===1?"":"s"} (restam ${left - extra} depois)`
    : `${sel} ${sel===1?"nota":"notas"}: grátis. ${names[first]} tem ${left} crédito${left===1?"":"s"} para notas extras.`;
  $("btnPlay").textContent = `▶ Tocar ${sel} ${sel === 1 ? "nota" : "notas"}`;
  $("banner").className = "banner" + (a.crowd ? " crowd" : a.team === 1 ? " t1" : "");
  $("bannerText").innerHTML = done ? "Rodada encerrada" : a.crowd
    ? `👏 VEZ DA PLATEIA DE ${esc(names[a.team].toUpperCase())}!<small>A plateia fala em voz alta e o apresentador digita</small>`
    : `🎯 Vez de ${esc(names[a.team])}`;
  const stepNames = [names[first], names[1-first], "Plateia"];
  $("steps").innerHTML = stepNames.map((n,i)=>`<span class="step ${i === Math.min(k,2) ? "now" : i < k ? "past" : ""}">${i+1}. ${esc(n)}</span>`).join("");
  $("judgeTitle").textContent = a.crowd ? `Digite o que a plateia de ${names[a.team]} falou` : `Digite a resposta de: ${names[a.team]}`;
  $("btnPass").textContent = k >= 2 ? "⏭ Passar para a outra plateia" : "⏭ Passar a vez";
  $("btnCrowd").hidden = k >= 2;
  // só as últimas tentativas: a lista não pode empurrar a tela
  $("tries").innerHTML = tries.slice(-4).map(t => `<li class="${t.skip ? "skip" : ""}">${esc(t.text)} <small>(${esc(t.by)})</small></li>`).join("");
  save();
}

function finish(winner){
  done = true; won = winner; stop();
  if (winner !== null) score[winner]++;
  celebrate = winner !== null;
  $("hintPop").hidden = true;
  showResult(winner);
  render();
  openStage();   // ainda dentro do clique/Enter do apresentador: o navegador libera tela cheia e som
}

function showResult(winner){
  const last = idx === SONGS.length-1;
  $("resMsg").className = "msg " + (winner !== null ? "ok" : "bad");
  $("resMsg").textContent = (winner !== null ? `✅ ${names[winner]} ganha o ponto! ` : "Ninguém ganhou o ponto. ")
    + `Era "${song.t}"` + (song.n ? ` (hino ${song.n})` : "") + ".";
  $("ytLink").href = `https://youtu.be/${song.v}?t=${song.st}`;
  if (last) {
    const [x,y] = score;
    $("btnNext").textContent = `Fim! ${x===y ? "Empate" : "Vitória: " + names[x>y?0:1]} (${x} × ${y}) — novo jogo`;
  } else $("btnNext").textContent = "Próxima música →";
  $("result").hidden = false;
}

// Trecho do YouTube em tela cheia, tocando sozinho; o apresentador fecha.
function openStage(){
  closeStage();
  const src = `https://www.youtube-nocookie.com/embed/${song.v}?start=${song.st}&end=${song.st+CLIP+20}&autoplay=1&rel=0&playsinline=1&modestbranding=1`;
  $("ytBox").innerHTML = `<iframe src="${src}" title="${esc(song.t)}" allow="autoplay; encrypted-media; fullscreen"></iframe>`;
  $("stage").hidden = false;
  if ($("stage").requestFullscreen) $("stage").requestFullscreen().catch(()=>{});  // sem suporte: o painel já cobre a tela
}
function closeStage(){
  $("ytBox").innerHTML = "";
  $("stage").hidden = true;
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  if (celebrate) { celebrate = false; confetti(); }
}

function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("confetti"), g = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#e6399b","#ff9f1c","#11a6a0","#ffd43b","#7950f2","#4dabf7"];
  const bits = Array.from({length:140},()=>({x:Math.random()*c.width, y:-20-Math.random()*c.height*.5,
    vx:(Math.random()-.5)*3, vy:2+Math.random()*4, r:Math.random()*6, vr:(Math.random()-.5)*.3,
    w:6+Math.random()*6, h:10+Math.random()*8, col:cols[Math.floor(Math.random()*cols.length)]}));
  const t0 = performance.now();
  (function frame(t){
    g.clearRect(0,0,c.width,c.height);
    bits.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.r+=b.vr; g.save(); g.translate(b.x,b.y); g.rotate(b.r); g.fillStyle=b.col; g.fillRect(-b.w/2,-b.h/2,b.w,b.h); g.restore(); });
    if (t - t0 < 4000) requestAnimationFrame(frame); else g.clearRect(0,0,c.width,c.height);
  })(t0);
}
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) closeStage(); });
$("btnCloseStage").onclick = closeStage;
$("btnReplay").onclick = openStage;

$("btnStart").onclick = newGame;
$("btnHint").onclick = () => { $("hintPop").hidden = false; };
$("hintPop").onclick = () => { $("hintPop").hidden = true; if (!done) $("answer").focus(); };

$("form").onsubmit = e => {
  e.preventDefault();
  const text = $("answer").value.trim();
  if (done || !text) return;
  const a = actor(tries.length);
  commit();
  if (matches(text, song)) { finish(a.team); return; }
  tries.push({text, by: who(a)});
  $("answer").value = "";
  render();
  $("answer").focus();
};

// o apresentador pode pular a vez de quem está respondendo, ou ir direto para a plateia
function skipTo(n){
  if (done) return;
  commit();
  while (tries.length < n) tries.push({text:"passou", by: who(actor(tries.length)), skip:true});
  render();
  $("answer").focus();
}
$("btnPass").onclick = () => skipTo(tries.length + 1);
$("btnCrowd").onclick = () => skipTo(2);

$("btnGive").onclick = () => { if (!done) finish(null); };

function stop(){ if (audio) { audio.pause(); audio = null; } }
// paga as notas escolhidas além das já liberadas (só o time que começa, antes de responder)
function commit(){
  if (done || tries.length > 0 || sel <= notes) return;
  credits[first] -= sel - notes; notes = sel;
}
function play(){
  commit(); render();
  stop();
  audio = new Audio(file(song, notes));
  audio.play().catch(()=>{});
}

$("btnPlay").onclick = play;
$("dots").onclick = e => {
  const n = +e.target.dataset.n;
  if (!n || done || tries.length > 0 || n < notes || n - notes > credits[first]) return;
  sel = n; render();
};
$("btnNext").onclick = () => {
  if (idx === SONGS.length-1) { forget(); stop(); showGame(false); }
  else { idx++; startRound(); }
};
$("btnReset").onclick = () => {
  if (!confirm("Reiniciar o jogo? O placar e o progresso serão apagados.")) return;
  forget(); stop(); closeStage(); showGame(false);
};
$("btnTheme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
};
restore();
</script>
